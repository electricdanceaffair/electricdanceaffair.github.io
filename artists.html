<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artists — Electric Dance Affair e.V.</title>
  <meta name="description" content="Die Artists von Electric Dance Affair e.V. — Künstler, DJs und Performer aus Augsburg und darüber hinaus.">
  <meta property="og:title" content="Artists — Electric Dance Affair e.V.">
  <meta property="og:description" content="Die Artists von Electric Dance Affair — DJs und Performer aus Augsburg und darüber hinaus.">
  <meta property="og:image" content="https://electric-dance-affair.de/images/og-image.jpg">
  <meta property="og:url" content="https://electric-dance-affair.de/artists.html">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0C0C0C">
  <link rel="canonical" href="https://electric-dance-affair.de/artists.html">
</head>
<body>
  <div class="site-wrapper">

    <header class="site-header">
      <div class="inner">
        <a href="index.html" class="site-brand">
          <img src="images/logo.png" alt="Electric Dance Affair Logo">
          <span>Electric Dance Affair</span>
        </a>
        <button class="nav-toggle" aria-label="Menü" onclick="document.querySelector('.site-nav').classList.toggle('open')">&#9776;</button>
        <nav>
          <ul class="site-nav">
            <li><a href="index.html">Veranstaltungen</a></li>
            <li><a href="https://electricdanceaffair.bandcamp.com/" target="_blank" rel="noopener">Shop</a></li>
            <li><a href="ueber.html">Über</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
            <li><a href="artists.html" class="active">Artists</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <section class="section">
        <div class="wrap">
          <div class="section__eyebrow">
            <span class="label">Artists</span>
          </div>
          <div class="artists-grid" id="artists-grid"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="inner">
        <div class="footer-col">
          <div class="footer-brand">Electric Dance Affair e.V.</div>
          <div class="footer-tagline">wo Kunst elektrisiert!</div>
        </div>
        <div class="footer-col">
          <div class="footer-col-title">Seiten</div>
          <a href="index.html">Veranstaltungen</a>
          <a href="ueber.html">Über</a>
          <a href="artists.html">Artists</a>
          <a href="https://electricdanceaffair.bandcamp.com/" target="_blank" rel="noopener">Shop</a>
          <a href="kontakt.html">Kontakt</a>
        </div>
        <div class="footer-col">
          <div class="footer-col-title">Social</div>
          <a href="https://www.instagram.com/electric.dance.affair/" target="_blank" rel="noopener">Instagram</a>
          <a href="https://soundcloud.com/electricdanceaffair" target="_blank" rel="noopener">SoundCloud</a>
          <a href="https://electricdanceaffair.bandcamp.com/" target="_blank" rel="noopener">Bandcamp</a>
        </div>
        <div class="footer-col">
          <div class="footer-col-title">Rechtliches</div>
          <a href="impressum.html">Impressum</a>
          <a href="datenschutz.html">Datenschutz</a>
        </div>
      </div>
    </footer>

  </div>

  <script>
    const PLATFORM_LABELS = {
      instagram: 'Instagram',
      soundcloud: 'SoundCloud',
      bandcamp: 'Bandcamp',
      spotify: 'Spotify',
      youtube: 'YouTube',
      mixcloud: 'Mixcloud'
    };

    fetch('artists.json')
      .then(r => r.json())
      .then(artists => {
        const grid = document.getElementById('artists-grid');
        grid.innerHTML = artists.map(a => {
          const photo = a.photo
            ? `<div class="artist-photo"><img src="${a.photo}" alt="${a.name}" loading="lazy"></div>`
            : `<div class="artist-photo artist-photo--placeholder"><span>${a.name.charAt(0)}</span></div>`;

          const genres = (a.genres || [])
            .map(g => `<span class="artist-tag">${g}</span>`).join('');

          const links = a.links
            ? Object.entries(a.links)
                .map(([k, url]) => `<a href="${url}" class="social-pill" target="_blank" rel="noopener">${PLATFORM_LABELS[k] || k}</a>`)
                .join('')
            : '';

          const details = [
            a.activeSince ? ['Aktiv seit', a.activeSince] : null,
            a.equipment ? ['Equipment', a.equipment] : null,
            a.influences ? ['Einflüsse', a.influences] : null,
            a.highlights ? ['Highlights', a.highlights] : null,
            a.secretSkill ? ['Geheimer Skill', a.secretSkill] : null,
            a.tracks ? ['Eigene Tracks', Array.isArray(a.tracks) ? a.tracks.join('<br>') : a.tracks] : null,
            a.favSong ? ['Lieblingslied', a.favSong] : null
          ].filter(Boolean)
           .map(([label, val]) => `<div class="artist-detail"><span class="artist-detail-label">${label}</span><span class="artist-detail-value">${val}</span></div>`)
           .join('');

          return `<article class="artist-card">
            ${photo}
            <div class="artist-body">
              <div class="artist-header">
                <h2 class="artist-name">${a.name}</h2>
                ${a.realName ? `<div class="artist-realname">${a.realName}</div>` : ''}
              </div>
              ${genres ? `<div class="artist-tags">${genres}</div>` : ''}
              ${''/* bio bleibt im JSON, wird aber nicht angezeigt */}
              ${details ? `<div class="artist-details">${details}</div>` : ''}
              ${links ? `<div class="social-row">${links}</div>` : ''}
            </div>
          </article>`;
        }).join('');

        const ld = artists.map(a => {
          const obj = { '@context': 'https://schema.org', '@type': 'Person', 'name': a.name };
          const urls = a.links ? Object.values(a.links) : [];
          if (urls.length) obj.sameAs = urls;
          return obj;
        });
        const s = document.createElement('script');
        s.type = 'application/ld+json';
        s.textContent = JSON.stringify(ld);
        document.head.appendChild(s);
      });
  </script>
</body>
</html>
